name: Connected commerce CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commerce:
    name: PostgreSQL, API and connected checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: crustcaper_dev
          POSTGRES_USER: crustcaper
          POSTGRES_PASSWORD: crustcaper-local
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U crustcaper -d crustcaper_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      EXPO_NO_TELEMETRY: '1'
      CRUSTCAPER_BUILD_PROFILE: local
      CRUSTCAPER_API_BASE_URL: http://127.0.0.1:18080/api/v1
      CRUSTCAPER_PORT: '18080'
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Test the transactional API and build the JAR
        working-directory: server
        run: bash ./gradlew --no-daemon test bootJar cyclonedxDirectBom
      - run: npm ci
      - run: npm run check
      - run: npm run build:connected-web
      - name: Verify customer checkout, recovery and operator pickup
        env:
          CRUSTCAPER_ORDER_ACCESS_PROVIDER: local
          CRUSTCAPER_ORDER_ACCESS_NEGATIVE_DELAY: PT0S
        shell: bash
        run: |
          java -jar server/build/libs/crustcaper-api.jar --spring.profiles.active=local >"$RUNNER_TEMP/crustcaper-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/actuator/health/readiness >/dev/null; then
              npm run test:connected
              exit
            fi
            kill -0 "$api_pid" || break
            sleep 1
          done
          sed -n '1,100p' "$RUNNER_TEMP/crustcaper-api.log"
          exit 1
      - name: Back up and restore the connected test database
        timeout-minutes: 3
        env:
          POSTGRES_SERVICE: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          tooling_dir=$(docker exec "$POSTGRES_SERVICE" mktemp -d)
          docker cp server/tooling/. "$POSTGRES_SERVICE:$tooling_dir/"
          docker exec --workdir "$tooling_dir" "$POSTGRES_SERVICE" bash -euc '
            export PGHOST=127.0.0.1 PGUSER="$POSTGRES_USER" PGDATABASE="$POSTGRES_DB"
            export PGPASSWORD="$POSTGRES_PASSWORD"
            bash test-postgres-recovery.sh
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crustcaper-api-${{ github.sha }}
          path: |
            server/build/libs/crustcaper-api.jar
            server/build/reports/crustcaper-api-sbom.json
          if-no-files-found: error
          retention-days: 14

  storefront:
    name: Public catalog and HTTPS checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CRUSTCAPER_FIXTURE_API_IMAGE: crustcaper-api:ci-${{ github.sha }}
      CRUSTCAPER_FIXTURE_CATALOG_IMAGE: crustcaper-catalog:ci-${{ github.sha }}
      CRUSTCAPER_FIXTURE_STOREFRONT_DIR: dist-storefront-test
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check the catalog package and lockfile
        run: |
          npm ci
          npm --prefix storefront ci
          npm --prefix storefront test
          node --test server/tooling/check-live-catalog.test.mjs server/tooling/storefront-availability.test.mjs
          npm --prefix storefront audit --omit=dev --audit-level=high
      - name: Build the HTTPS checkout and isolated provider fixture
        run: |
          npm run build:storefront-test
          (cd server && bash ./gradlew --no-daemon testClasses)
      - name: Build the deployment images
        run: |
          docker build -t "$CRUSTCAPER_FIXTURE_API_IMAGE" ./server
          docker build -f storefront/Dockerfile -t "$CRUSTCAPER_FIXTURE_CATALOG_IMAGE" .
      - name: Verify the published menu photos, guest session and hosted payment through HTTPS
        env:
          CRUSTCAPER_HTTPS_TEST_EVIDENCE_DIR: ${{ runner.temp }}/crustcaper-https-evidence
        run: |
          google-chrome --version
          mkdir -p "$CRUSTCAPER_HTTPS_TEST_EVIDENCE_DIR"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            docker image inspect --format 'api={{.Id}}' "$CRUSTCAPER_FIXTURE_API_IMAGE"
            docker image inspect --format 'catalog={{.Id}}' "$CRUSTCAPER_FIXTURE_CATALOG_IMAGE"
          } >"$CRUSTCAPER_HTTPS_TEST_EVIDENCE_DIR/candidate.txt"
          npm run test:storefront:catalog-photos
      - name: Verify scheduled payment reconciliation and the open kitchen board after a forced API stop
        timeout-minutes: 5
        env:
          CRUSTCAPER_HTTPS_TEST_EVIDENCE_DIR: ${{ runner.temp }}/crustcaper-https-evidence/payment-restart
        run: npm run test:storefront:kitchen-restart
      - name: Verify external availability signals during catalog and API outages
        timeout-minutes: 5
        env:
          CRUSTCAPER_HTTPS_TEST_EVIDENCE_DIR: ${{ runner.temp }}/crustcaper-https-evidence/availability
        run: npm run test:storefront:availability
      - name: Verify API error signals during a partial checkout failure
        timeout-minutes: 5
        env:
          CRUSTCAPER_HTTPS_TEST_EVIDENCE_DIR: ${{ runner.temp }}/crustcaper-https-evidence/api-errors
        run: |
          node --test server/tooling/api-error-watch.test.mjs server/tooling/payment-reconciliation-watch.test.mjs
          npm run test:storefront:api-errors
      - name: Recover a live checkout database with its hosted payment ledger intact
        timeout-minutes: 6
        env:
          CRUSTCAPER_HTTPS_TEST_EVIDENCE_DIR: ${{ runner.temp }}/crustcaper-https-evidence/database-recovery
        run: npm run test:storefront:database-recovery
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: crustcaper-storefront-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/crustcaper-https-evidence
          if-no-files-found: ignore
          retention-days: 14
