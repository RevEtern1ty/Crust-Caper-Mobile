name: Mobile CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Native builds, pilot checks or connected minimum runtime checks
        type: choice
        options:
          - native
          - pilot
          - ios-minimum
          - ios-minimum-checkout
          - ios-current-checkout
          - ios-runner-probe
          - android-minimum-connected
        default: native
      android_apk_run:
        description: Successful Mobile CI run ID with a demo APK for pilot checks
        type: string
        required: false
      ios_legacy_runner_probe:
        description: Run only the Settings probe on iOS 16.0 with Xcode 16.4 (suite ios-runner-probe)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verification:
    name: Verify mobile source and bundles
    if: inputs.suite != 'ios-runner-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        shell: bash
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts='HEAD --all' .

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: npm ci
      - run: npm run check
      - name: Verify Android smoke failure and cleanup handling
        run: bash tooling/test-android-emulator-smoke.sh
      - name: Verify stage and production native configuration
        run: node tooling/check-native-profiles.cjs
      - run: npm run build:web
      - name: Verify checkout and reachable screens in Chrome
        run: npm run test:web
        env:
          CRUST_SCREENSHOT_DIR: ${{ runner.temp }}/crustcaper-web-screenshots
      - name: Retain browser screenshots for visual review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-web-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/crustcaper-web-screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build:android
      - run: npm run build:ios
      - name: Generate dependency SBOM
        run: npm run --silent sbom > "$RUNNER_TEMP/crustcaper.cdx.json"

      - name: Package the local browser demo
        run: |
          preview="$RUNNER_TEMP/crustcaper-web-preview"
          mkdir -p "$preview"
          cp -R dist "$preview/"
          cp tooling/Start_Demo.cmd tooling/Start_Here.txt tooling/preview-server.cjs "$preview/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-web-preview-${{ github.sha }}
          path: ${{ runner.temp }}/crustcaper-web-preview/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-dependency-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/crustcaper.cdx.json
          if-no-files-found: error
          retention-days: 14

  android-demo:
    name: ${{ matrix.profile == 'local' && 'Build and verify Android 9 connected checkout' || format('Compile Android {0} APK', matrix.artifact) }}
    if: inputs.suite != 'pilot' && inputs.suite != 'ios-minimum' && inputs.suite != 'ios-minimum-checkout' && inputs.suite != 'ios-current-checkout' && inputs.suite != 'ios-runner-probe' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.suite == 'android-minimum-connected'
              && '[{"profile":"local","artifact":"local-api28"}]'
              || '[{"profile":"demo","artifact":"demo"},{"profile":"stage","artifact":"connected-ci"}]') }}
    env:
      EXPO_NO_TELEMETRY: 1
      CRUSTCAPER_BUILD_PROFILE: ${{ matrix.profile }}
      CRUSTCAPER_API_BASE_URL: ${{ matrix.profile == 'local' && 'http://10.0.2.2:18080/api/v1' || 'https://api-stage.crustcaper.invalid/api/v1' }}
      CRUSTCAPER_STORE_ID: ${{ matrix.profile == 'local' && 'kigali' || 'ci-test-store' }}
      CRUSTCAPER_PSP_HOSTS: checkout.crustcaper.invalid
      CRUSTCAPER_APP_LINK_ORIGIN: https://stage.crustcaper.invalid
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Install the Android SDK packages required by the build
        timeout-minutes: 8
        shell: bash
        run: |
          ndk_version="$(sed -nE 's/^ndkVersion = "([^"]+)"$/\1/p' node_modules/react-native/gradle/libs.versions.toml)"
          [[ "$ndk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ndk="$ANDROID_HOME/ndk/$ndk_version"
          packages=()
          [[ -f "$ndk/source.properties" ]] || packages+=("ndk;$ndk_version")
          [[ -f "$ANDROID_HOME/platforms/android-36/android.jar" ]] || packages+=('platforms;android-36')
          [[ -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]] || packages+=('build-tools;36.0.0')
          # Android Gradle Plugin also configures native libraries with these revisions.
          [[ -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]] || packages+=('build-tools;35.0.0')
          [[ -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake" ]] || packages+=('cmake;3.22.1')
          if (( ${#packages[@]} )); then
            timeout --kill-after=5s 7m "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="$ANDROID_HOME" --install "${packages[@]}" </dev/null
          fi
          test -f "$ndk/source.properties"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          printf 'ANDROID_NDK=%s\nANDROID_NDK_HOME=%s\nANDROID_NDK_ROOT=%s\n' "$ndk" "$ndk" "$ndk" >> "$GITHUB_ENV"
      - run: npx expo prebuild --platform android --no-install
      - name: Build with bundled JS and debug signing
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          bash ./gradlew --no-daemon --max-workers=2 ':app:assembleRelease' \
            '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' \
            '-PreactNativeArchitectures=arm64-v8a,x86_64'
      - name: Verify the APK identity, permissions, signature, embedded settings and bundled JS
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          expected_package="com.crustcaper.mobile.$CRUSTCAPER_BUILD_PROFILE"
          expected_min_sdk=$(node -p 'require("./app.json").expo.plugins.find(plugin => Array.isArray(plugin) && plugin[0] === "expo-build-properties")[1].android.minSdkVersion')
          signer=$("$tools/apksigner" verify --print-certs "$apk")
          printf '%s\n' "$signer"
          grep -Eq '^Signer #[[:digit:]]+ certificate DN: .*CN=Android Debug([,[:space:]]|$)' <<< "$signer"
          manifest=$("$tools/aapt" dump badging "$apk")
          grep -Fq "package: name='$expected_package'" <<< "$manifest"
          grep -Fxq "sdkVersion:'$expected_min_sdk'" <<< "$manifest"
          architectures=$(grep '^native-code:' <<< "$manifest")
          grep -Fq "'arm64-v8a'" <<< "$architectures"
          grep -Fq "'x86_64'" <<< "$architectures"
          permissions=$("$tools/aapt" dump permissions "$apk")
          for permission in android.permission.READ_EXTERNAL_STORAGE android.permission.WRITE_EXTERNAL_STORAGE android.permission.SYSTEM_ALERT_WINDOW; do
            if grep -Fq "name='$permission'" <<< "$permissions"; then
              printf 'Found an unexpected permission: %s\n' "$permission" >&2
              exit 1
            fi
          done
          manifest_tree=$("$tools/aapt" dump xmltree "$apk" AndroidManifest.xml)
          grep -Eq 'android:allowBackup\(0x[0-9a-f]+\)=\(type 0x12\)0x0$' <<< "$manifest_tree"
          if [ "$CRUSTCAPER_BUILD_PROFILE" = stage ]; then
            grep -Eq 'android:usesCleartextTraffic\(0x[0-9a-f]+\)=\(type 0x12\)0x0$' <<< "$manifest_tree"
            grep -Eq 'android:autoVerify\(0x[0-9a-f]+\)=\(type 0x12\)0xffffffff$' <<< "$manifest_tree"
            app_link_host=$(node -p 'new URL(process.env.CRUSTCAPER_APP_LINK_ORIGIN).host')
            grep -Fq "=\"$app_link_host\"" <<< "$manifest_tree"
            grep -Fq '="/payment-return"' <<< "$manifest_tree"
          fi
          unzip -p "$apk" assets/app.config > "$RUNNER_TEMP/crustcaper-app.config"
          node - "$RUNNER_TEMP/crustcaper-app.config" "$expected_package" <<'NODE'
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');
          const config = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const profile = process.env.CRUSTCAPER_BUILD_PROFILE;
          assert.equal(config.android.package, process.argv[3]);
          assert.equal(config.scheme, `crustcaper-${profile}`);
          const expected = profile === 'demo' ? { profile } : {
            profile,
            apiBaseUrl: process.env.CRUSTCAPER_API_BASE_URL,
            storeId: process.env.CRUSTCAPER_STORE_ID,
            pspHosts: profile === 'local' ? [] : [process.env.CRUSTCAPER_PSP_HOSTS],
          };
          assert.deepEqual(config.extra.restaurant, expected);
          NODE
          bundle_size=$(unzip -p "$apk" assets/index.android.bundle | wc -c)
          test "$bundle_size" -gt 0
          printf '%s\n' "$architectures"
          printf 'APK package: %s\nAPK minimum SDK: %s\nBundled JS size: %s bytes\n' \
            "$expected_package" "$expected_min_sdk" "$bundle_size"
          sha256sum "$apk"
      - name: Verify 16 KiB APK and ELF segment alignment
        run: |
          python3 tooling/check-android-page-size.py android/app/build/outputs/apk/release/app-release.apk \
            --zipalign "$ANDROID_HOME/build-tools/36.0.0/zipalign"
      - name: Smoke-test the same APK offline in a headless Android emulator
        if: matrix.profile != 'local'
        id: android_smoke
        timeout-minutes: 20
        shell: bash
        run: |
          bash tooling/run-android-emulator-ci.sh android/app/build/outputs/apk/release/app-release.apk \
            "$CRUSTCAPER_BUILD_PROFILE" "$RUNNER_TEMP/crustcaper-android-smoke" 35
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        if: matrix.profile == 'local'
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify a connected pickup order on Android 9
        if: matrix.profile == 'local'
        id: android_connected
        timeout-minutes: 30
        shell: bash
        run: |
          bash tooling/android-connected-ci.sh android/app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/crustcaper-android-smoke"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-android-${{ matrix.artifact }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Retain Android emulator evidence
        if: ${{ !cancelled() && (steps.android_smoke.outcome == 'success' || steps.android_smoke.outcome == 'failure' || steps.android_connected.outcome == 'success' || steps.android_connected.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-android-${{ matrix.artifact }}-emulator-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/crustcaper-android-smoke/
          if-no-files-found: error
          retention-days: 14

  android-minimum:
    name: Run the verified Android APK on API 28
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate source and locate the original APK evidence
        id: previous_android
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ inputs.android_apk_run }}
        run: node tooling/prepare-android-minimum-ci.cjs source "$APK_RUN_ID" demo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.previous_android.outputs.apk_artifact_name }}
          path: ${{ runner.temp }}/crustcaper-prior-apk
          run-id: ${{ inputs.android_apk_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.previous_android.outputs.smoke_artifact_name }}
          path: ${{ runner.temp }}/crustcaper-prior-android-evidence
          run-id: ${{ inputs.android_apk_run }}
          github-token: ${{ github.token }}
      - name: Verify APK bytes and the originating smoke result
        env:
          APK_SOURCE_SHA: ${{ steps.previous_android.outputs.source_sha }}
        run: |
          node tooling/prepare-android-minimum-ci.cjs verify "$APK_SOURCE_SHA" demo \
            "$RUNNER_TEMP/crustcaper-prior-apk/app-release.apk" "$RUNNER_TEMP/crustcaper-prior-android-evidence"
      - name: Launch the same APK twice offline on Android 9
        id: minimum_smoke
        timeout-minutes: 20
        env:
          APK_SOURCE_SHA: ${{ steps.previous_android.outputs.source_sha }}
          APK_RUN_ID: ${{ inputs.android_apk_run }}
        run: |
          evidence_dir="$RUNNER_TEMP/crustcaper-android-minimum"
          mkdir "$evidence_dir"
          printf 'apk_source_sha=%s\napk_source_run=%s\n' "$APK_SOURCE_SHA" "$APK_RUN_ID" > "$evidence_dir/apk-source.txt"
          bash tooling/run-android-emulator-ci.sh "$RUNNER_TEMP/crustcaper-prior-apk/app-release.apk" demo "$evidence_dir" 28
      - name: Retain Android 9 smoke evidence
        if: ${{ !cancelled() && steps.minimum_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-android-minimum-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/crustcaper-android-minimum/
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: ${{ inputs.suite == 'ios-current-checkout' && 'Verify customer checkout on iOS 26.5' || inputs.suite == 'ios-minimum-checkout' && 'Verify customer checkout on iOS 16.0' || inputs.suite == 'ios-minimum' && 'Verify connected Release on iOS 16.0' || inputs.suite == 'pilot' && 'Build iOS Release and load menu from the local API' || 'Build and launch iOS demo on simulator' }}
    if: inputs.suite != 'android-minimum-connected' && inputs.suite != 'ios-runner-probe' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    timeout-minutes: ${{ (inputs.suite == 'ios-minimum-checkout' || inputs.suite == 'ios-current-checkout') && 75 || inputs.suite == 'ios-minimum' && 60 || 45 }}
    env:
      EXPO_NO_TELEMETRY: 1
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare the exact iOS 16.0 runtime
        if: inputs.suite == 'ios-minimum' || inputs.suite == 'ios-minimum-checkout'
        id: minimum_runtime
        timeout-minutes: 15
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          bash tooling/prepare-ios-minimum-ci.sh "$RUNNER_TEMP/crustcaper-ios-smoke"
      - name: Prepare the proved iOS 26.5 checkout runtime
        if: inputs.suite == 'ios-current-checkout'
        id: current_runtime
        timeout-minutes: 6
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          bash tooling/prepare-ios-current-ci.sh "$RUNNER_TEMP/crustcaper-ios-smoke"
      - name: Shut down the verified simulator during native compilation
        if: inputs.suite == 'ios-minimum-checkout' || inputs.suite == 'ios-current-checkout'
        timeout-minutes: 2
        env:
          SIMULATOR_UDID: ${{ steps.minimum_runtime.outputs.simulator || steps.current_runtime.outputs.simulator }}
        run: xcrun simctl shutdown "$SIMULATOR_UDID"
      - run: npm ci
      - name: Verify iOS sharing completion in Swift
        run: node --import tsx --test src/checkout/receipt-sharing-ios.test.ts
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        if: inputs.suite == 'pilot' || inputs.suite == 'ios-minimum' || inputs.suite == 'ios-minimum-checkout' || inputs.suite == 'ios-current-checkout'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install PostgreSQL 17 for the connected iOS fixture
        if: inputs.suite == 'pilot' || inputs.suite == 'ios-minimum' || inputs.suite == 'ios-minimum-checkout' || inputs.suite == 'ios-current-checkout'
        timeout-minutes: 6
        run: |
          if ! brew list --versions postgresql@17 >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install postgresql@17
          fi
          test -x "$(brew --prefix postgresql@17)/bin/initdb"
      - name: Build unsigned Release and verify simulator launch
        if: inputs.suite != 'pilot' && inputs.suite != 'ios-minimum' && inputs.suite != 'ios-minimum-checkout' && inputs.suite != 'ios-current-checkout'
        id: simulator_smoke
        shell: bash
        run: |
          evidence_dir="$RUNNER_TEMP/crustcaper-ios-smoke"
          mkdir -p "$evidence_dir"
          bash tooling/ios-simulator-smoke.sh "$evidence_dir" 2>&1 | tee "$evidence_dir/smoke.log"
      - name: Verify the connected iOS app against Spring Boot
        if: inputs.suite == 'pilot' || inputs.suite == 'ios-minimum' || inputs.suite == 'ios-minimum-checkout' || inputs.suite == 'ios-current-checkout'
        id: connected_smoke
        timeout-minutes: ${{ (inputs.suite == 'ios-minimum-checkout' || inputs.suite == 'ios-current-checkout') && 52 || inputs.suite == 'ios-minimum' && 36 || 45 }}
        shell: bash
        env:
          CRUSTCAPER_IOS_SIMULATOR_UDID: ${{ steps.minimum_runtime.outputs.simulator || steps.current_runtime.outputs.simulator }}
          CRUSTCAPER_VERIFY_IOS_MINIMUM: ${{ inputs.suite == 'ios-minimum' || inputs.suite == 'ios-minimum-checkout' }}
          CRUSTCAPER_IOS_ORDER_SMOKE: ${{ (inputs.suite == 'ios-minimum-checkout' || inputs.suite == 'ios-current-checkout') && '1' || '0' }}
          CRUSTCAPER_IOS_ORDER_RUNTIME: ${{ inputs.suite == 'ios-current-checkout' && '26-5' || '16-0' }}
        run: |
          evidence_dir="$RUNNER_TEMP/crustcaper-ios-smoke"
          mkdir -p "$evidence_dir"
          if [[ "$CRUSTCAPER_VERIFY_IOS_MINIMUM" == true ]]; then
            test -n "$CRUSTCAPER_IOS_SIMULATOR_UDID"
          fi
          bash tooling/ios-connected-ci.sh "$evidence_dir" 2>&1 | tee "$evidence_dir/connected-smoke.log"
          if [[ "$CRUSTCAPER_VERIFY_IOS_MINIMUM" == true ]]; then
            grep -Fxq 'Simulator: iPhone 14 on iOS 16-0' "$evidence_dir/simulator/evidence.txt"
            grep -Fxq "Simulator UUID: $CRUSTCAPER_IOS_SIMULATOR_UDID" "$evidence_dir/simulator/evidence.txt"
          fi
          if [[ "$CRUSTCAPER_IOS_ORDER_RUNTIME" == 26-5 ]]; then
            grep -Fxq 'Simulator: iPhone 17 on iOS 26-5' "$evidence_dir/simulator/evidence.txt"
            grep -Fxq "Simulator UUID: $CRUSTCAPER_IOS_SIMULATOR_UDID" "$evidence_dir/simulator/evidence.txt"
          fi
      - name: Remove the checkout simulator created by this job
        if: ${{ always() && (steps.minimum_runtime.outputs.simulator != '' || steps.current_runtime.outputs.simulator != '') }}
        timeout-minutes: 2
        env:
          SIMULATOR_UDID: ${{ steps.minimum_runtime.outputs.simulator || steps.current_runtime.outputs.simulator }}
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID"
      - name: Retain simulator evidence
        if: ${{ !cancelled() && (steps.minimum_runtime.outcome == 'success' || steps.minimum_runtime.outcome == 'failure' || steps.current_runtime.outcome == 'success' || steps.current_runtime.outcome == 'failure' || steps.simulator_smoke.outcome != 'skipped' || steps.connected_smoke.outcome != 'skipped') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-ios-simulator-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/crustcaper-ios-smoke/
          if-no-files-found: error
          retention-days: 14

  ios-runner-probe:
    name: XCTest startup on iOS ${{ matrix.runtime }} with Xcode ${{ matrix.xcode }}
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'ios-runner-probe'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.ios_legacy_runner_probe
            && '[{"runner":"macos-15","xcode":"16.4","runtime":"16.0"}]'
            || '[{"runner":"macos-26","xcode":"26.6","runtime":"16.0"},{"runner":"macos-26","xcode":"26.6","runtime":"26.5"},{"runner":"macos-15","xcode":"26.2","runtime":"16.0"}]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      PROBE_RUNTIME: ${{ matrix.runtime }}
      LEGACY_PROBE: ${{ inputs.ios_legacy_runner_probe }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare the isolated probe simulator
        id: probe_simulator
        timeout-minutes: 13
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/crustcaper-ios-probe"
          mkdir -p "$evidence"
          if [[ "$LEGACY_PROBE" == true ]]; then
            xcodebuild -version > "$evidence/xctest-xcode.txt"
            diff -u <(printf 'Xcode 16.4\nBuild version 16F6\n') "$evidence/xctest-xcode.txt"
            # Use the Apple catalog path already proven on this image, then boot and test with Xcode 16.4.
            bash tooling/prepare-ios-minimum-ci.sh "$evidence" /Applications/Xcode_26.2.app/Contents/Developer
          elif [[ "$PROBE_RUNTIME" == 16.0 ]]; then
            bash tooling/prepare-ios-minimum-ci.sh "$evidence"
          else
            bash tooling/prepare-ios-current-ci.sh "$evidence"
          fi
      - name: Check XCTest can launch iOS Settings
        timeout-minutes: 11
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.probe_simulator.outputs.simulator }}
        run: bash tooling/ios-order-ui-ci.sh "$SIMULATOR_UDID" "$RUNNER_TEMP/crustcaper-ios-probe/result" probe
      - name: Delete the simulator allocated to this probe
        if: ${{ always() && steps.probe_simulator.outputs.simulator != '' }}
        timeout-minutes: 2
        env:
          SIMULATOR_UDID: ${{ steps.probe_simulator.outputs.simulator }}
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID"
      - name: Retain XCTest startup evidence
        if: ${{ !cancelled() && steps.probe_simulator.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-ios-runner-probe-${{ matrix.xcode }}-${{ matrix.runtime }}-${{ github.sha }}
          path: ${{ runner.temp }}/crustcaper-ios-probe/
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Audit npm lockfile
    if: inputs.suite != 'ios-runner-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm audit --package-lock-only --audit-level=high
