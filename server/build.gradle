plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.10'
    id 'org.cyclonedx.bom' version '3.6.1'
}

group = 'com.crustcaper'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Keep cached Spring test contexts within the shared PostgreSQL connection limit.
    systemProperty 'spring.datasource.hikari.maximum-pool-size', '4'
}

tasks.named('bootJar') {
    archiveFileName = 'crustcaper-api.jar'
}

tasks.named('cyclonedxDirectBom') {
    includeConfigs = ['runtimeClasspath']
    failOnUnresolvedDependencies = true
    jsonOutput = layout.buildDirectory.file('reports/crustcaper-api-sbom.json')
}
