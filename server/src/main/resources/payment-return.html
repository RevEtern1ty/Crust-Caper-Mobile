<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Return to CrustCaper</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; color: #2b1827; background: #fff5e6; font: 1rem/1.55 system-ui, sans-serif }
    main { max-width: 36rem; margin: 0 auto; padding: 2rem 1.25rem }
    header { color: #fff5e6; background: #2b1827; padding: .75rem 1.25rem; font-weight: 700 }
    h1 { font-size: clamp(1.5rem, 5vw, 2.25rem); line-height: 1.2 }
    section { border-block-start: 1px solid #dfcdbb; margin-block-start: 1.5rem; padding-block-start: .75rem }
    h2 { font-size: 1.2rem }
  </style>
</head>
<body>
  <header>CrustCaper</header>
  <main>
    <h1>Return to CrustCaper</h1>
    <p>Open the CrustCaper app on the device you ordered with. Go to <strong>Orders</strong> to see the payment and pickup status.</p>
    <section lang="rw">
      <h2>Subira muri CrustCaper</h2>
      <p>Fungura porogaramu ya CrustCaper ku gikoresho wakoresheje utumiza. Jya muri <strong>Komande</strong> urebe uko ubwishyu na komande bihagaze.</p>
    </section>
  </main>
</body>
</html>
