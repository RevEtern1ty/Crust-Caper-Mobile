spring:
  application:
    name: crustcaper-api
  datasource:
    url: ${CRUSTCAPER_DB_URL}
    username: ${CRUSTCAPER_DB_USER}
    password: ${CRUSTCAPER_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${CRUSTCAPER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
crustcaper:
  payment:
    provider: ${CRUSTCAPER_PAYMENT_PROVIDER:flutterwave}
