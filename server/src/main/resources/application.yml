spring:
  application:
    name: crustcaper-api
  datasource:
    url: ${CRUSTCAPER_DB_URL}
    username: ${CRUSTCAPER_DB_USER}
    password: ${CRUSTCAPER_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      data-source-properties:
        "[connectTimeout]": "3"
        "[socketTimeout]": "6"
  flyway:
    # Startup migrations use their own connection and can run longer than web requests.
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    clean-disabled: true
    validate-on-migrate: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${CRUSTCAPER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
logging:
  level:
    # PDF parser diagnostics can include values from the uploaded receipt.
    org.apache.pdfbox: "OFF"
management:
  endpoints:
    web:
      exposure:
        include: health,commerceerrors,paymentreconciliation
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
crustcaper:
  edge-rate:
    enabled: ${CRUSTCAPER_EDGE_RATE_ENABLED:false}
    proof: ${CRUSTCAPER_EDGE_RATE_PROOF:}
    sessions-per-minute: ${CRUSTCAPER_EDGE_RATE_SESSIONS_PER_MINUTE:120}
    otp-starts-per-minute: ${CRUSTCAPER_EDGE_RATE_OTP_STARTS_PER_MINUTE:30}
    otp-verifications-per-minute: ${CRUSTCAPER_EDGE_RATE_OTP_VERIFICATIONS_PER_MINUTE:60}
    staff-logins-per-minute: ${CRUSTCAPER_EDGE_RATE_STAFF_LOGINS_PER_MINUTE:30}
    quotes-per-minute: ${CRUSTCAPER_EDGE_RATE_QUOTES_PER_MINUTE:120}
    orders-per-minute: ${CRUSTCAPER_EDGE_RATE_ORDERS_PER_MINUTE:60}
  checkout:
    quotas:
      quotes-per-session: ${CRUSTCAPER_CHECKOUT_QUOTES_PER_SESSION:30}
      quotes-per-store: ${CRUSTCAPER_CHECKOUT_QUOTES_PER_STORE:240}
      orders-per-session: ${CRUSTCAPER_CHECKOUT_ORDERS_PER_SESSION:8}
      orders-per-store: ${CRUSTCAPER_CHECKOUT_ORDERS_PER_STORE:120}
  web:
    origin: ${CRUSTCAPER_WEB_ORIGIN:}
  operator:
    mfa-key: ${CRUSTCAPER_OPERATOR_MFA_KEY:}
  app-links:
    ios-app-id: ${CRUSTCAPER_APP_LINK_IOS_APP_ID:}
    android-package: ${CRUSTCAPER_APP_LINK_ANDROID_PACKAGE:}
    android-fingerprints: ${CRUSTCAPER_APP_LINK_ANDROID_FINGERPRINTS:}
  payment:
    provider: ${CRUSTCAPER_PAYMENT_PROVIDER:flutterwave}
    flutterwave:
      options: ${CRUSTCAPER_FLUTTERWAVE_PAYMENT_OPTIONS:}
  push:
    provider: ${CRUSTCAPER_PUSH_PROVIDER:disabled}
    token-key: ${CRUSTCAPER_PUSH_TOKEN_KEY:}
    expo-access-token: ${CRUSTCAPER_EXPO_PUSH_ACCESS_TOKEN:}
