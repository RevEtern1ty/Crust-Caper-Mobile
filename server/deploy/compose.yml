services:
  api:
    image: ${CRUSTCAPER_API_IMAGE:?Set the verified API image or digest}
    env_file:
      - path: ${CRUSTCAPER_API_ENV_FILE:?Set the path to the API secret environment file}
        format: raw
    environment:
      CRUSTCAPER_PORT: "8080"
    ports:
      - "127.0.0.1:${CRUSTCAPER_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${CRUSTCAPER_POSTGRES_CA_FILE:?Set the path to the PostgreSQL CA certificate}
        target: /run/crustcaper/postgres-ca.crt
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --noproxy, "*", --output, /dev/null, http://127.0.0.1:8080/actuator/health/readiness]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
