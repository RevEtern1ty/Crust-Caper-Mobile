services:
  api:
    image: ${CRUSTCAPER_API_IMAGE:?Set the verified API image or digest}
    env_file:
      - ${CRUSTCAPER_API_ENV_FILE:?Set the path to the API secret environment file}
    environment:
      CRUSTCAPER_PORT: "8080"
    ports:
      - "127.0.0.1:${CRUSTCAPER_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
