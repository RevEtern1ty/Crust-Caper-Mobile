services:
  api:
    ports: !reset []

  edge:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    depends_on:
      - api
    environment:
      CRUSTCAPER_HTTPS_HOST: ${CRUSTCAPER_HTTPS_HOST:?Set the public staging hostname}
    ports:
      - target: 80
        published: "80"
        host_ip: ${CRUSTCAPER_HTTPS_BIND_IP:?Set the host listener IP}
      - target: 443
        published: "443"
        host_ip: ${CRUSTCAPER_HTTPS_BIND_IP:?Set the host listener IP}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - edge_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://api:8080/actuator/health/readiness]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  edge_data:
