openapi: 3.1.0
info:
  title: CrustCaper Shared API
  version: 0.12.0
  description: Implemented Spring Boot commerce API. The web routes require an enabled storefront origin and otherwise return 404.
servers:
  - url: /api/v1
paths:
  /stores/{id}/menu:
    get:
      operationId: getMenu
      description: Products are filtered by the selected sales channel. Products sold on that channel outside their Kigali sales hours remain listed as unavailable. The representation is evaluated at the server time returned in X-Availability-Checked-At.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string, enum: [mobile, web], default: mobile }
        - name: locale
          in: query
          schema: { type: string, enum: [en, rw] }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Versioned public menu, catalog and pickup availability.
          headers:
            ETag:
              schema: { type: string }
            X-Availability-Checked-At:
              description: Server time used to evaluate sales hours and pickup slot availability. The catalog revision time is reported in updatedAt.
              schema: { $ref: '#/components/schemas/Timestamp' }
            X-Next-Sale-Change-At:
              $ref: '#/components/headers/NextSaleChangeAt'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
        '304':
          description: Cached representation is current.
          headers:
            X-Availability-Checked-At:
              description: Server time used to revalidate product and pickup slot availability.
              schema: { $ref: '#/components/schemas/Timestamp' }
            X-Next-Sale-Change-At:
              $ref: '#/components/headers/NextSaleChangeAt'
        '400': { $ref: '#/components/responses/InvalidInput' }
        '404': { $ref: '#/components/responses/StoreUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /guest-sessions:
    post:
      operationId: createGuestSession
      responses:
        '200': { $ref: '#/components/responses/GuestSession' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /guest-sessions/refresh:
    post:
      operationId: refreshGuestSession
      description: Clients that have a sessionId save a rotationKey before refreshing. Retrying that key with the previous token returns the same successor while that successor remains current. Older clients can omit the key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestRefreshInput' }
      responses:
        '200': { $ref: '#/components/responses/GuestSession' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /guest-sessions/revoke:
    post:
      operationId: revokeGuestSession
      description: Ends the guest session without deleting its orders. When the latest refresh outcome is unknown, send the same previous token and saved rotationKey. A well-formed request is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestRefreshInput' }
      responses:
        '204':
          description: This request left no matching credential active.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /quotes:
    post:
      operationId: createQuote
      description: Evaluate purchase eligibility for the mobile channel at the time of this request. Existing quote change rules cover unavailable items.
      security: [{ guestOrAccount: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Current total and pickup window bound to this quote, with changes requiring client acknowledgement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/StoreUnavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /orders:
    post:
      operationId: createOrder
      description: Create a reservation against a mobile quote. The server rechecks product eligibility at confirmation. An exact retry of an already accepted reservation returns the existing order.
      security: [{ guestOrAccount: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, phone]
              properties:
                quoteId: { type: string }
                phone: { type: string, description: Order contact. }
                email:
                  type: string
                  format: email
                  description: Required when the configured payment provider is Flutterwave.
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /orders/recovery:
    get:
      operationId: recoverOrder
      security: [{ guestOrAccount: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /checkout-recovery:
    post:
      operationId: recoverPendingMobileCheckout
      security: [{ guestOrAccount: [] }]
      description: |
        Resolves a mobile checkout when the original guest session can no longer repeat
        the saved create request. Use the original mobile quote and idempotency key
        with the phone entered at checkout. If an order exists, confirm the returned
        challenge with the same bearer through /order-access/challenges/{id}/verify.
        Verification permits checkout for that mobile order only. The original order,
        guest, request key and payment attempts keep their identities. While an unused
        quote can still produce an order, the result is waiting. Clear the saved create
        intent only after not_placed or after the verified order has been saved locally.
      requestBody:
        $ref: '#/components/requestBodies/PendingCheckoutRecovery'
      responses:
        '200': { $ref: '#/components/responses/PendingCheckoutRecovery' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      security: [{ guestOrAccount: [] }]
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /orders/{id}/receipt:
    get:
      operationId: downloadFiscalReceipt
      security: [{ guestOrAccount: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The attached original PDF from the seller's EBM. Available to the order owner and an authorized recovery guest.
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
  /orders/{id}/receipt-correction:
    get:
      operationId: downloadFiscalReceiptCorrection
      description: Download the separately attached EBM correction for a verified full refund. The original remains available at the receipt endpoint.
      security: [{ guestOrAccount: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The attached correction PDF. Available to the order owner and an authorized recovery guest.
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
  /orders/{id}/data-export:
    get:
      operationId: exportOrderData
      security: [{ guestOrAccount: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      description: The contact and order details for one order. The same guest session must have verified the phone through order access in the past ten minutes.
      responses:
        '200': { $ref: '#/components/responses/OrderDataExport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /orders/{id}/erasure-request:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrderErasureRequest
      security: [{ guestOrAccount: [] }]
      description: Read the deletion request for one order after recent phone verification in the same guest session.
      responses:
        '200': { $ref: '#/components/responses/OrderErasureRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: requestOrderErasure
      security: [{ guestOrAccount: [] }]
      description: Submit the order for a data retention review. A repeat returns the same request. Submission does not modify the order, payment or receipt.
      responses:
        '200': { $ref: '#/components/responses/OrderErasureRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /orders/{id}/pickup-alert:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/PickupInstallationId'
    get:
      operationId: getPickupAlert
      security: [{ guestOrAccount: [] }]
      description: Returns the saved preference for this installation and order and whether the push provider is available. Visible to the original guest or a guest with a valid recovery grant.
      responses:
        '200': { $ref: '#/components/responses/PickupAlert' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
    put:
      operationId: enablePickupAlert
      security: [{ guestOrAccount: [] }]
      description: Enables a ready notification for a paid order while it is accepted or preparing and its pickup window has not ended. Repeating the request for the same guest and installation updates its preference while enrollment stays open.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickupAlertRequest' }
      responses:
        '200': { $ref: '#/components/responses/PickupAlert' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '409':
          description: Order state prevents enrollment or the tracked installation limit has been reached.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - type: object
                    properties:
                      status: { const: 409 }
                      code: { enum: [pickup_alert_unavailable, pickup_alert_limit] }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: disablePickupAlert
      security: [{ guestOrAccount: [] }]
      description: Revokes the preference and clears the saved Expo token for this guest, installation and order. The operation is idempotent and available when the push provider is disabled.
      responses:
        '204':
          description: The preference is disabled.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
  /orders/{id}/reorder:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: reorder
      security: [{ guestOrAccount: [] }]
      responses:
        '200':
          description: Current cart lines and changes based on an order visible to the guest.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reorder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /orders/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: startPayment
      security: [{ guestOrAccount: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Stable payment attempt. Its checkout URL can be absent while an uncertain provider outcome is being reconciled.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAttempt' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /order-access/challenges:
    post:
      operationId: requestOrderAccessChallenge
      security: [{ guestOrAccount: [] }]
      description: Requests verification of the checkout phone for one saved order. Acknowledgement does not disclose whether the order and phone matched or an SMS was sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderCode, phone]
              properties:
                orderCode: { type: string, pattern: '^#?[0-9A-Fa-f]{8}$' }
                phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', writeOnly: true }
      responses:
        '202':
          description: Verification request acknowledged. Preserve the challenge ID on the requesting device for this flow.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [challengeId]
                properties:
                  challengeId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /order-access/challenges/{challengeId}/verify:
    post:
      operationId: verifyOrderAccessChallenge
      security: [{ guestOrAccount: [] }]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '200':
          description: This guest can read and reorder the verified order. Original checkout and payment rights remain with the order owner. Repeating a successful challenge as the same guest returns the same order ID.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [orderId]
                properties:
                  orderId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: Verification is unavailable or unsuccessful. Shares a response across missing, expired, foreign and rejected challenges.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/NotFoundProblem' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /web/session:
    get:
      operationId: getWebSession
      security: [{ webGuest: [] }]
      description: Returns the browser session marker that identifies the HttpOnly cookie already set in this browser.
      responses:
        '200': { $ref: '#/components/responses/WebSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createWebSession
      parameters:
        - $ref: '#/components/parameters/WebOrigin'
        - $ref: '#/components/parameters/WebWrite'
      description: Reuses an active cookie or sets a new __Host-crustcaper-web cookie with Secure, HttpOnly, SameSite=Lax and Path=/.
      responses:
        '200': { $ref: '#/components/responses/WebSession' }
        '403': { $ref: '#/components/responses/WebOriginRejected' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: deleteWebSession
      parameters:
        - $ref: '#/components/parameters/WebOrigin'
        - $ref: '#/components/parameters/WebWrite'
        - $ref: '#/components/parameters/WebSessionContext'
      description: Revokes the matching browser session. A retry with the cookie already removed succeeds.
      responses:
        '204': { description: The matching cookie is cleared. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WebOriginRejected' }
  /web/quotes:
    post:
      operationId: createWebQuote
      description: Evaluate purchase eligibility for the web channel at the time of this request. Existing quote change rules cover unavailable items.
      security: [{ webGuest: [] }]
      parameters:
        - $ref: '#/components/parameters/WebOrigin'
        - $ref: '#/components/parameters/WebWrite'
        - $ref: '#/components/parameters/WebSessionContext'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Current quote bound to this browser session.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WebOriginRejected' }
        '404': { $ref: '#/components/responses/StoreUnavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /web/orders:
    post:
      operationId: createWebOrder
      description: Create a reservation against a web quote. The server rechecks product eligibility at confirmation. An exact retry of an already accepted reservation returns the existing order.
      security: [{ webGuest: [] }]
      parameters:
        - $ref: '#/components/parameters/WebOrigin'
        - $ref: '#/components/parameters/WebWrite'
        - $ref: '#/components/parameters/WebSessionContext'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/paths/~1orders/post/requestBody'
      responses:
        '200': { $ref: '#/components/responses/WebOrder' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WebOriginRejected' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /web/checkout-recovery:
    post:
      operationId: recoverPendingWebCheckout
      security: [{ webGuest: [] }]
      parameters:
        - $ref: '#/components/parameters/WebOrigin'
        - $ref: '#/components/parameters/WebWrite'
        - $ref: '#/components/parameters/WebSessionContext'
      description: |
        Checks an unfinished checkout saved in this browser. The quote and original creation key
        identify the attempt. A committed order requires phone verification through the existing
        web verification route. Verified access permits checkout for that order only. Only
        not_placed allows the client to clear the saved attempt and start a new checkout.
      requestBody:
        $ref: '#/components/requestBodies/PendingCheckoutRecovery'
      responses:
        '200': { $ref: '#/components/responses/PendingCheckoutRecovery' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WebOriginRejected' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /web/orders/recovery:
    get:
      operationId: recoverWebOrder
      security: [{ webGuest: [] }]
      parameters:
        - $ref: '#/components/parameters/WebSessionContext'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/WebOrder' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /web/orders/{id}:
    get:
      operationId: getWebOrder
      security: [{ webGuest: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/WebSessionContext'
      responses:
        '200': { $ref: '#/components/responses/WebOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /web/orders/{id}/receipt:
    get:
      operationId: downloadWebFiscalReceipt
      security: [{ webGuest: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/WebSessionContext'
      responses:
        '200': { $ref: '#/paths/~1orders~1{id}~1receipt/get/responses/200' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
  /web/orders/{id}/receipt-correction:
    get:
      operationId: downloadWebFiscalReceiptCorrection
      security: [{ webGuest: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/WebSessionContext'
      responses:
        '200': { $ref: '#/paths/~1orders~1{id}~1receipt-correction/get/responses/200' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
  /web/orders/{id}/data-export:
    get:
      operationId: exportWebOrderData
      security: [{ webGuest: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/WebSessionContext'
      description: The contact and order details for one order after recent phone verification in the web guest session.
      responses:
        '200': { $ref: '#/components/responses/OrderDataExport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /web/orders/{id}/erasure-request:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/WebSessionContext'
    get:
      operationId: getWebOrderErasureRequest
      security: [{ webGuest: [] }]
      responses:
        '200': { $ref: '#/components/responses/OrderErasureRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: requestWebOrderErasure
      security: [{ webGuest: [] }]
      parameters:
        - $ref: '#/components/parameters/WebOrigin'
        - $ref: '#/components/parameters/WebWrite'
      description: Submit a deletion request in the recently verified web guest session. Repeated submissions return the same request.
      responses:
        '200': { $ref: '#/components/responses/OrderErasureRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WebOriginRejected' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /web/orders/{id}/reorder:
    post:
      operationId: reorderWebOrder
      security: [{ webGuest: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/WebOrigin'
        - $ref: '#/components/parameters/WebWrite'
        - $ref: '#/components/parameters/WebSessionContext'
      responses:
        '200': { $ref: '#/paths/~1orders~1{id}~1reorder/post/responses/200' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WebOriginRejected' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /web/orders/{id}/payments:
    post:
      operationId: startWebPayment
      security: [{ webGuest: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/WebOrigin'
        - $ref: '#/components/parameters/WebWrite'
        - $ref: '#/components/parameters/WebSessionContext'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/paths/~1orders~1{id}~1payments/post/responses/200' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WebOriginRejected' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /web/order-access/challenges:
    post:
      operationId: requestWebOrderAccessChallenge
      security: [{ webGuest: [] }]
      parameters:
        - $ref: '#/components/parameters/WebOrigin'
        - $ref: '#/components/parameters/WebWrite'
        - $ref: '#/components/parameters/WebSessionContext'
      requestBody:
        $ref: '#/paths/~1order-access~1challenges/post/requestBody'
      responses:
        '202': { $ref: '#/paths/~1order-access~1challenges/post/responses/202' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WebOriginRejected' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /web/order-access/challenges/{challengeId}/verify:
    post:
      operationId: verifyWebOrderAccessChallenge
      description: Verifies the code and grants access to one order. An unfinished-checkout challenge also permits payment on that order. Ordinary order number challenges grant read-only access.
      security: [{ webGuest: [] }]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/WebOrigin'
        - $ref: '#/components/parameters/WebWrite'
        - $ref: '#/components/parameters/WebSessionContext'
      requestBody:
        $ref: '#/paths/~1order-access~1challenges~1{challengeId}~1verify/post/requestBody'
      responses:
        '200': { $ref: '#/paths/~1order-access~1challenges~1{challengeId}~1verify/post/responses/200' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WebOriginRejected' }
        '404': { $ref: '#/paths/~1order-access~1challenges~1{challengeId}~1verify/post/responses/404' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/sessions:
    post:
      operationId: createOperatorSession
      description: Verify the staff password and authenticator code together. Stage and production require both; the local synthetic accounts allow the password alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
                authenticatorCode:
                  type: string
                  pattern: '^[0-9]{6}$'
                  writeOnly: true
                  description: Current six-digit code from the enrolled authenticator. Keep leading zeroes. A code can be accepted only once.
      responses:
        '201':
          description: Short-lived operator session and its authorized role and store.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresAt, storeId, role]
                properties:
                  accessToken: { type: string }
                  expiresAt: { $ref: '#/components/schemas/Timestamp' }
                  storeId: { type: string }
                  role: { type: string, enum: [kitchen, pickup, manager] }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/OperatorRateLimited' }
  /operator/sessions/current:
    delete:
      operationId: revokeOperatorSession
      security: [{ operatorBearer: [] }]
      responses:
        '204': { description: The credential has been revoked or was already absent. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /operator/orders:
    get:
      operationId: listOperatorOrders
      security: [{ operatorBearer: [] }]
      responses:
        '200':
          description: Active CrustCaper and manually registered delivery orders for the session's assigned store.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [orders, serverTime]
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/OperatorOrder' }
                  externalOrders:
                    type: array
                    items: { $ref: '#/components/schemas/ExternalOperatorOrder' }
                    description: Active delivery platform orders. Omitted when the store has no active delivery platform orders.
                  serverTime:
                    $ref: '#/components/schemas/Timestamp'
                    description: Database clock sampled after reading the queue. Used to calculate elapsed time without relying on the browser's wall clock.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/external-order-channels:
    get:
      operationId: listExternalOrderChannels
      description: Enabled delivery platforms in the assigned store. Requires a pickup operator or manager.
      security: [{ operatorBearer: [] }]
      responses:
        '200':
          description: Platforms available for manual entry.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items:
                      type: object
                      required: [id, label]
                      properties:
                        id: { $ref: '#/components/schemas/ExternalOrderChannelId' }
                        label: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/external-orders:
    post:
      operationId: registerExternalOrder
      description: A pickup operator or manager registers an existing platform order for preparation and handoff. The store comes from the staff session. Request JSON is limited to 64 KiB.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel, externalReference, scheduledAt, lines]
              properties:
                channel: { $ref: '#/components/schemas/ExternalOrderChannelId' }
                externalReference: { $ref: '#/components/schemas/ExternalOrderReference' }
                scheduledAt:
                  type: string
                  format: date-time
                  pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$'
                  description: Handoff time in UTC with at most six fractional digits.
                lines:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { $ref: '#/components/schemas/ExternalOrderLine' }
      responses:
        '200':
          description: The same order was already registered with these details. Returns its current state, including if it has since been collected or cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalOperatorOrder' }
        '201':
          description: Order registered in the store's kitchen queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalOperatorOrder' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '409':
          description: Platform disabled or unknown in this store, or the reference is already registered with different details.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - properties:
                      status: { const: 409 }
                      code: { enum: [external_channel_unavailable, external_reference_conflict] }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/external-orders/{id}:
    get:
      operationId: readExternalOrder
      description: Check the current status of a platform order from the session's assigned store after an uncertain response.
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Current order state and attribution of successful handoff to the authenticated operator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalOperatorOrder' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/external-orders/{id}/status:
    post:
      operationId: updateExternalOrderStatus
      description: Kitchen and manager can prepare and mark orders ready. Pickup and manager can confirm handoff against the platform reference. A manager can cancel an active delivery order in the kitchen queue.
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [preparing, ready, collected, cancelled] }
                externalReference: { $ref: '#/components/schemas/ExternalOrderReference' }
              if:
                properties:
                  status: { const: collected }
              then:
                required: [externalReference]
      responses:
        '200':
          description: The recorded order state after applying the authorized transition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalOperatorOrder' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '409':
          description: The transition is unavailable or the presented platform reference did not match.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - properties:
                      status: { const: 409 }
                      code: { enum: [external_reference_mismatch, invalid_transition] }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/orders/lookup:
    get:
      operationId: lookupOperatorPickupOrder
      description: A pickup operator or manager can locate a paid direct order in the assigned store. The result is read-only and collection requires the existing pickup code.
      security: [{ operatorBearer: [] }]
      parameters:
        - name: orderCode
          in: query
          required: true
          description: Exact eight-hex order number or full hyphenated order ID. Matching is case-insensitive.
          schema: { $ref: '#/components/schemas/OperatorOrderReference' }
      responses:
        '200':
          description: Minimal pickup status and window for the located order.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [orderId, status, pickupStartsAt, pickupEndsAt]
                properties:
                  orderId: { type: string, format: uuid }
                  status: { type: string, enum: [accepted, preparing, ready, collected] }
                  pickupStartsAt: { type: string, format: date-time }
                  pickupEndsAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '404': { description: No eligible order was found in this store. }
        '409':
          description: More than one eligible order in this store shares the short order code. The full order ID resolves the ambiguity.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - properties:
                      status: { const: 409 }
                      code: { const: order_code_ambiguous }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/orders/{id}/pickup-status:
    get:
      operationId: getOperatorPickupStatus
      description: A pickup operator or manager can check the current state of an order in the assigned store after an uncertain collection response.
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Current order status and whether the successful collection is recorded for the authenticated operator.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status, confirmedByCurrentOperator]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [awaiting_payment, accepted, preparing, ready, collected, cancelled] }
                  confirmedByCurrentOperator:
                    type: boolean
                    description: True only when a successful collection is recorded for this operator. The status can be collected when a different operator confirmed it.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/orders/{id}/status:
    post:
      operationId: updateOperatorOrderStatus
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [preparing, ready, collected] }
                pickupCode: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
              if:
                properties:
                  status: { const: collected }
              then:
                required: [pickupCode]
      responses:
        '200':
          description: Updated order. The server checks store, role, sequence and pickup code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorOrder' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '409':
          description: The requested transition is unavailable or the pickup code did not match.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - properties:
                      status: { const: 409 }
                      code: { enum: [invalid_transition, pickup_code_mismatch] }
        '429': { $ref: '#/components/responses/OperatorRateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/availability:
    get:
      operationId: getMenuAvailability
      security: [{ operatorBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/OperatorAvailability' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
    patch:
      operationId: setMenuAvailability
      description: Modify availability for the manager's restaurant using the current catalog version. A pickup limit must cover active reservations. A pickup schedule adds future ten-minute windows without changing existing windows. An exact retry of a published schedule ID and values returns the latest snapshot even when the expected version is old. The request body is limited to 2 KiB.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [expectedVersion, open]
                  properties:
                    expectedVersion: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
                    open: { type: boolean }
                - type: object
                  additionalProperties: false
                  required: [expectedVersion, sku, available]
                  properties:
                    expectedVersion: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
                    sku: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
                    available: { type: boolean }
                - type: object
                  additionalProperties: false
                  required: [expectedVersion, slotId, capacity]
                  properties:
                    expectedVersion: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
                    slotId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
                    capacity: { type: integer, minimum: 0, maximum: 2147483647 }
                - type: object
                  additionalProperties: false
                  required: [expectedVersion, pickupSchedule]
                  properties:
                    expectedVersion: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
                    pickupSchedule:
                      type: object
                      additionalProperties: false
                      required: [id, date, start, end, capacity]
                      properties:
                        id: { type: string, format: uuid, description: Client-generated ID for retrying the same publication. }
                        date: { type: string, format: date, description: Local calendar date in Africa/Kigali. }
                        start: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5]0$', description: Inclusive Kigali time. }
                        end: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5]0$', description: Exclusive Kigali time on the same date. }
                        capacity: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        '200': { $ref: '#/components/responses/OperatorAvailability' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '404': { description: The item or pickup window does not exist in the assigned restaurant. }
        '415': { description: The request body must be sent as application/json. }
        '409':
          description: The catalog version changed, the window has started, the limit is below active reservations, or the new schedule overlaps existing windows or reuses an ID with different values.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - properties:
                      status: { const: 409 }
                      code: { enum: [catalog_version_conflict, slot_update_closed, slot_capacity_below_reserved, pickup_schedule_started, pickup_schedule_overlap, pickup_schedule_conflict] }
  /operator/catalog/recipe-approvals:
    post:
      operationId: approveCatalogRecipe
      description: Record a manager's review of the exact recipe and allergen facts for the proposed catalog version at their assigned restaurant. Requires confirmation of ingredients, allergens and cross-contact. The same review can be repeated without replacing its author or timestamp. Publication is performed separately by the catalog importer. The request body is limited to 64 KiB.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, expectedVersion, catalogVersion, sku, crossContactConfirmed, facts]
              properties:
                storeId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }
                expectedVersion: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
                catalogVersion: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
                sku: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
                crossContactConfirmed: { const: true }
                facts:
                  type: object
                  additionalProperties: false
                  required: [recipeVersion, allergenVersion, ingredients, allergens]
                  properties:
                    recipeVersion: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
                    allergenVersion: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
                    ingredients: { type: array, items: { $ref: '#/components/schemas/Localized' } }
                    allergens: { type: array, items: { $ref: '#/components/schemas/Localized' } }
      responses:
        '200':
          description: The recorded review and whether the importer applied it.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [storeId, sku, expectedVersion, catalogVersion, recipeVersion, allergenVersion, approvedAt]
                properties:
                  storeId: { type: string }
                  sku: { type: string }
                  expectedVersion: { type: string }
                  catalogVersion: { type: string }
                  recipeVersion: { type: string }
                  allergenVersion: { type: string }
                  approvedAt: { type: string, format: date-time }
                  appliedAt: { type: [string, 'null'], format: date-time }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '404': { description: The assigned restaurant no longer exists. }
        '409':
          description: The version is stale or this proposal already has a review with different facts.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - properties:
                      status: { const: 409 }
                      code: { enum: [catalog_version_conflict, catalog_recipe_conflict] }
        '415': { description: The request body must be sent as application/json. }
  /operator/receipts:
    get:
      operationId: listOperatorReceipts
      security: [{ operatorBearer: [] }]
      parameters:
        - name: orderCode
          in: query
          description: Exact case-insensitive match on the eight-hex order number or the full hyphenated order ID. Omit it for the rolling queue.
          schema: { $ref: '#/components/schemas/OperatorOrderReference' }
      responses:
        '200':
          description: Up to 100 paid orders for the manager's store, starting with orders awaiting a receipt. An exact lookup returns one matching paid order or an empty list.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/OperatorReceipt' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '409':
          description: More than one eligible order in this store shares the short order code. The full order ID resolves the ambiguity.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - properties:
                      status: { const: 409 }
                      code: { const: receipt_order_code_ambiguous }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/orders/{id}/cancel:
    post:
      operationId: cancelPaidOrder
      description: A manager can cancel an accepted, preparing or ready paid order in the assigned store. The original payment is added to Payment review. Repeating a restaurant cancellation returns the current cancellation and refund status.
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Cancelled order with the current refund status.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorCancelledOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '409':
          description: The order cannot transition to cancelled, or its original verified transaction cannot be identified.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - type: object
                    properties:
                      status: { const: 409 }
                      code: { enum: [invalid_transition, payment_reference_unavailable] }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/orders/{id}/receipt:
    put:
      operationId: attachFiscalReceipt
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: X-Receipt-Reference
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,79}$' }
        - name: X-Receipt-Total-RWF
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Original receipt attached. An exact replay returns the existing attachment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorReceipt' }
        '400':
          description: Invalid upload metadata or an unreadable new PDF. The order keeps its receipt state.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - type: object
                    properties:
                      status: { const: 400 }
                      code: { enum: [invalid_input, invalid_receipt_pdf] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '409':
          description: The receipt amount differs from the order, another receipt is attached, or the EBM reference is already in use.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '413': { description: The PDF exceeds 1 MiB. }
        '415': { description: The request must contain a PDF. }
  /operator/orders/{id}/receipt-correction:
    put:
      operationId: attachFiscalReceiptCorrection
      description: An assigned manager attaches the correction issued by the EBM for an order with an original receipt and a confirmed full refund. An exact repeat returns the stored correction without replacing its author or content.
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: X-Receipt-Reference
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,79}$' }
        - name: X-Receipt-Total-RWF
          in: header
          required: true
          description: The positive full refund amount shown in the correction, in whole RWF.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: The correction has been attached and the order receipt is marked corrected. The original is preserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorReceipt' }
        '400': { $ref: '#/paths/~1operator~1orders~1{id}~1receipt/put/responses/400' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '409':
          description: The order has no eligible original and full refund, the amount differs, a conflicting correction is already attached, or the reference is in use.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '413': { description: The PDF exceeds 1 MiB. }
        '415': { description: The request must contain a PDF. }
  /operator/payment-exceptions:
    get:
      operationId: listOperatorPaymentExceptions
      security: [{ operatorBearer: [] }]
      description: Read-only payment exceptions for the manager's assigned store. Requests without a state return the legacy newest-first list. Open exceptions appear oldest first and verified exceptions appear newest first.
      parameters:
        - name: state
          in: query
          description: Filter by whether a verified refund is recorded for this exact charge.
          schema: { type: string, enum: [open, verified] }
        - name: after
          in: query
          description: Use nextCursor from the previous page of the same state. An unavailable cursor returns an empty page.
          schema: { type: string }
      responses:
        '200':
          description: Up to 50 persisted payment exceptions. Filtered pages include nextCursor, with null marking the end.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorPaymentReview' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/erasure-requests:
    get:
      operationId: listOperatorErasureRequests
      security: [{ operatorBearer: [] }]
      description: Order deletion requests from the manager's assigned store. The response contains request metadata.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderErasureStatus', default: pending }
      responses:
        '200':
          description: Up to 100 requests in the selected state.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/OperatorErasureRequest' } }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/erasure-requests/{requestId}/review:
    post:
      operationId: startOperatorErasureReview
      security: [{ operatorBearer: [] }]
      description: Record the manager and time of the first review action. Replays preserve the recorded action.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Request marked in review for referral to the data retention reviewer.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorErasureRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '404': { $ref: '#/components/responses/OrderUnavailable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/operations/signals:
    get:
      operationId: getOperatorOperationsSignals
      security: [{ operatorBearer: [] }]
      description: Read-only operational counts for the authenticated manager's assigned store. Both counts use one database snapshot.
      responses:
        '200':
          description: A snapshot of overdue handoffs and missing receipts for direct orders.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorOperationsSignals' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/reconciliation:
    get:
      operationId: getOperatorDailyReconciliation
      security: [{ operatorBearer: [] }]
      description: Recorded platform activity and current follow-up counts for the manager's store on one Kigali calendar date.
      parameters:
        - $ref: '#/components/parameters/ReconciliationDate'
      responses:
        '200':
          description: A snapshot of order, payment exception, verified refund and receipt records.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorDailyReconciliation' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/reconciliation/export:
    get:
      operationId: exportOperatorDailyReconciliation
      security: [{ operatorBearer: [] }]
      description: Export recorded activity for one Kigali date and the manager's assigned store. The columns contain event type, recording time, order and payment references, nominal RWF amount, exception reason and current review status.
      parameters:
        - $ref: '#/components/parameters/ReconciliationDate'
      responses:
        '200':
          description: UTF-8 CSV attachment for the requested date.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Content-Disposition:
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/payment-attempts/pending:
    get:
      operationId: listOperatorPendingPaymentAttempts
      security: [{ operatorBearer: [] }]
      description: Unresolved Flutterwave attempts for the manager's store after 48 hours from reservation expiration.
      parameters:
        - name: after
          in: query
          required: false
          description: Merchant reference of the last attempt on the previous page. An unavailable cursor returns an empty page.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Up to 50 eligible attempts, oldest expired reservations first. Local payment mode returns an empty list.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorPendingPaymentAttempts' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '404': { description: The cursor is malformed. }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/payment-attempts/{merchantReference}/recheck:
    post:
      operationId: recheckOperatorPendingPaymentAttempt
      security: [{ operatorBearer: [] }]
      parameters:
        - name: merchantReference
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Existing attempt rechecked by reference. A verified late payment is recorded for refund review.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [pending, settled] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '404': { description: The reference is invalid or no eligible unresolved attempt with that reference belongs to the manager's store. }
        '409':
          description: The last verification claim is less than 60 seconds old (payment_check_cooldown), or the provider payment does not match the stored attempt (payment_mismatch).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /operator/payment-exceptions/{merchantReference}/{providerTransactionId}/refund:
    post:
      operationId: verifyOperatorRefund
      security: [{ operatorBearer: [] }]
      parameters:
        - name: merchantReference
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: providerTransactionId
          in: path
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerRefundId]
              properties:
                providerRefundId: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
      responses:
        '200':
          description: Full refund verified and recorded for the existing payment exception. A repeat returns the same record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifiedRefund' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OperatorForbidden' }
        '404': { description: No payment exception with these identifiers is accessible to this manager. }
        '409':
          description: The provider has not confirmed the requested full refund, or a different refund is already recorded.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503':
          description: The provider refund verification service is unavailable.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /webhooks/flutterwave:
    post:
      operationId: receiveFlutterwaveEvent
      description: Flutterwave Standard V3 webhook. The server independently verifies completed charge events.
      security: [{ flutterwaveWebhook: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string }
                data:
                  type: object
                  properties:
                    id: { type: [integer, string] }
      responses:
        '200': { description: Event acknowledged. Confirmed payment effects are idempotent. }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  headers:
    NextSaleChangeAt:
      description: Earliest upcoming availability change caused by the published sales hours of a product in this channel. Omitted when no product has a scheduled change. Clients can calculate the delay from X-Availability-Checked-At.
      schema: { $ref: '#/components/schemas/Timestamp' }
  securitySchemes:
    webGuest:
      type: apiKey
      in: cookie
      name: __Host-crustcaper-web
      description: Secure and HttpOnly guest credential scoped to the storefront host.
    guestOrAccount:
      type: http
      scheme: bearer
      description: Opaque guest bearer credential. The server verifies order access for each operation.
    operatorBearer:
      type: http
      scheme: bearer
      description: Opaque staff bearer issued by POST /operator/sessions. Store and role are verified on the server.
    flutterwaveWebhook:
      type: apiKey
      in: header
      name: verif-hash
  parameters:
    WebOrigin:
      name: Origin
      in: header
      required: true
      description: Browser-supplied origin. Must equal the configured HTTPS storefront origin.
      schema: { type: string, format: uri }
    WebWrite:
      name: X-CrustCaper-Web
      in: header
      required: true
      schema: { type: string, const: '1' }
    WebSessionContext:
      name: X-CrustCaper-Session
      in: header
      required: true
      description: Nonsecret session marker from the web session endpoint. Must match the session authenticated by the cookie.
      schema: { type: string, format: uuid }
    ReconciliationDate:
      name: date
      in: query
      required: true
      description: Gregorian calendar date in Africa/Kigali. The next midnight is excluded.
      schema: { type: string, format: date }
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string }
    PickupInstallationId:
      name: X-Installation-Id
      in: header
      required: true
      description: Stable identifier generated and stored by the native installation.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reuse the key with the same payload to recover the original operation.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
  requestBodies:
    PendingCheckoutRecovery:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [quoteId, key, phone]
            properties:
              quoteId: { type: string, format: uuid }
              key: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$', writeOnly: true }
              phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', writeOnly: true }
  responses:
    PendingCheckoutRecovery:
      description: Current attempt resolution. An acknowledgement alone grants no order access.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required: [state, retryAt]
                properties:
                  state: { type: string, const: waiting }
                  retryAt: { $ref: '#/components/schemas/Timestamp' }
              - type: object
                required: [state]
                properties:
                  state: { type: string, const: not_placed }
              - type: object
                required: [state, challengeId]
                properties:
                  state: { type: string, const: verify }
                  challengeId: { type: string, format: uuid }
    WebSession:
      description: Browser session marker and expiry.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        Set-Cookie:
          description: Present when a new session is set.
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            required: [sessionId, expiresAt]
            properties:
              sessionId: { type: string, format: uuid }
              expiresAt: { $ref: '#/components/schemas/Timestamp' }
    WebOrder:
      description: Order visible to the browser session. Issued receipts use the web receipt route.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Order'
              - type: object
                properties:
                  recoveryReadOnly: { type: boolean, const: true }
    WebOriginRejected:
      description: Origin or write marker is missing or invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    PickupAlert:
      description: Current notification preference for the guest, installation and order.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PickupAlert' }
    OrderDataExport:
      description: Order and contact data for the verified guest.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderDataExport' }
    OrderErasureRequest:
      description: The order's deletion request or null before submission.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderErasureRequestResponse' }
    OperatorAvailability:
      description: Current restaurant and item availability. Changes to published values advance the version.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OperatorAvailability' }
    GuestSession:
      description: Opaque guest credentials and expirations. Keep both tokens in protected client storage.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GuestSession' }
    Order:
      description: Order snapshot with independently updated kitchen, payment and fiscal states.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Order' }
    InvalidInput:
      description: The operation requires valid parameters, contact or idempotency key.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - type: object
                properties:
                  status: { const: 400 }
                  code: { const: invalid_input }
    Unauthenticated:
      description: The operation requires valid credentials.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - type: object
                properties:
                  status: { const: 401 }
                  code: { const: unauthenticated }
    StoreUnavailable:
      description: The store is unavailable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/NotFoundProblem' }
    OrderUnavailable:
      description: The order is unavailable to the current session. Use the same response for missing and inaccessible orders.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/NotFoundProblem' }
    Conflict:
      description: Price or availability changed, the quote or reservation expired, or an operation conflicts with current state.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - type: object
                properties:
                  status: { const: 409 }
                  code:
                    enum: [quote_expired, quote_changed, slot_unavailable, conflict, reservation_expired, payment_pending, payment_mismatch]
    ServiceUnavailable:
      description: The service or upstream provider is temporarily unavailable.
      headers:
        X-Request-ID:
          description: Opaque request ID for errors returned by the API. Infrastructure errors may omit it.
          schema: { type: string, format: uuid }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - type: object
                properties:
                  status: { const: 503 }
                  code: { const: service_unavailable }
    OperatorForbidden:
      description: The operator session lacks the role required by this operation.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - properties:
                  status: { const: 403 }
                  code: { const: forbidden }
    OperatorRateLimited:
      description: The operator must wait before retrying.
      headers:
        Retry-After:
          schema: { type: integer, const: 120 }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - properties:
                  status: { const: 429 }
                  code: { const: rate_limited }
  schemas:
    PickupAlert:
      type: object
      required: [available, enabled]
      properties:
        available: { type: boolean, description: The server is configured to send push notifications. }
        enabled: { type: boolean }
    PickupAlertRequest:
      type: object
      required: [token, locale]
      properties:
        token:
          type: string
          pattern: '^(Expo|Exponent)PushToken\[[A-Za-z0-9_-]{1,128}\]$'
          writeOnly: true
        locale: { type: string, enum: [en, rw] }
    OperatorAvailability:
      type: object
      required: [version, open, products, slots]
      properties:
        version: { type: string }
        open: { type: boolean }
        products:
          type: array
          items:
            type: object
            required: [sku, name, available]
            properties:
              sku: { type: string }
              name: { $ref: '#/components/schemas/Localized' }
              available: { type: boolean }
        slots:
          type: array
          maxItems: 36
          description: Upcoming pickup windows, ordered by start time and ID. Reservation counts reflect this snapshot.
          items:
            type: object
            required: [id, startsAt, endsAt, capacity, reserved]
            properties:
              id: { type: string }
              startsAt: { $ref: '#/components/schemas/Timestamp' }
              endsAt: { $ref: '#/components/schemas/Timestamp' }
              capacity: { type: integer, minimum: 0, maximum: 2147483647 }
              reserved: { type: integer, minimum: 0 }
    OperatorReceipt:
      type: object
      required: [orderId, status, total, currency, receiptStatus]
      properties:
        orderId: { type: string, format: uuid }
        status: { type: string }
        total: { $ref: '#/components/schemas/Amount' }
        currency: { type: string, const: RWF }
        receiptStatus: { type: string, enum: [pending, issued, corrected] }
        receiptReference: { type: ['string', 'null'] }
        correctionReference: { type: ['string', 'null'] }
        correctionEligible: { type: boolean, description: An original exists and the full refund is verified. The manager can attach a correction. }
    VerifiedRefund:
      type: object
      required: [providerRefundId, refundStatus, amount, currency, recordedAt]
      properties:
        providerRefundId: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        refundStatus: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { type: string, const: RWF }
        recordedAt: { $ref: '#/components/schemas/Timestamp' }
    OperatorOrderDetails:
      type: object
      required: [id, lines, total, currency, pickupStartsAt, pickupEndsAt, acceptedAt]
      properties:
        id: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            required: [sku, modifierIds, quantity]
            properties:
              sku: { type: string }
              modifierIds: { type: array, items: { type: string } }
              quantity: { type: integer, minimum: 1 }
              soldItem: { $ref: '#/components/schemas/SoldItem' }
        total:
          $ref: '#/components/schemas/Amount'
          description: Persisted total of the direct order in whole RWF.
        currency: { type: string, const: RWF }
        pickupStartsAt: { $ref: '#/components/schemas/Timestamp' }
        pickupEndsAt: { $ref: '#/components/schemas/Timestamp' }
        acceptedAt:
          description: Time of the verified payment and accepted kitchen transition. Null for historical orders without this timestamp.
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    OperatorOrderReference:
      type: string
      pattern: '^(?:[0-9A-Fa-f]{8}|[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})$'
    OperatorOrder:
      allOf:
        - $ref: '#/components/schemas/OperatorOrderDetails'
        - type: object
          required: [status, paymentStatus]
          properties:
            status: { type: string, enum: [accepted, preparing, ready, collected] }
            paymentStatus: { type: string, const: paid }
    ExternalOrderChannelId:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{0,31}$'
    ExternalOrderReference:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$'
      description: Use the complete platform reference. Case and leading zeroes are significant.
    ExternalOrderLine:
      type: object
      additionalProperties: false
      required: [name, quantity]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        modifiers:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 120 }
    ExternalOperatorOrder:
      type: object
      additionalProperties: false
      required: [id, channel, channelLabel, externalReference, scheduledAt, acceptedAt, status, lines, confirmedByCurrentOperator]
      properties:
        id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/ExternalOrderChannelId' }
        channelLabel: { type: string }
        externalReference: { $ref: '#/components/schemas/ExternalOrderReference' }
        scheduledAt: { $ref: '#/components/schemas/Timestamp' }
        acceptedAt: { $ref: '#/components/schemas/Timestamp' }
        status: { type: string, enum: [accepted, preparing, ready, collected, cancelled] }
        lines:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ExternalOrderLine'
              - required: [modifiers]
        confirmedByCurrentOperator:
          type: boolean
          description: True only when the order was handed off by the authenticated operator.
    OperatorCancelledOrder:
      allOf:
        - $ref: '#/components/schemas/OperatorOrderDetails'
        - type: object
          required: [status, paymentStatus]
          properties:
            status: { type: string, const: cancelled }
            paymentStatus: { type: string, enum: [refund_pending, refunded] }
    ReconciliationBucket:
      type: object
      additionalProperties: false
      required: [count, amountRwf]
      properties:
        count: { type: integer, minimum: 0, format: int64 }
        amountRwf:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          description: Exact nominal amount, in whole RWF.
    OperatorOperationsSignals:
      type: object
      additionalProperties: false
      required: [observedAt, paymentWithoutKitchen, fiscalReceiptsOverdue, fiscalReceiptOverdueAfterMinutes]
      properties:
        observedAt: { $ref: '#/components/schemas/Timestamp' }
        paymentWithoutKitchen:
          type: integer
          format: int64
          minimum: 0
          description: Orders absent from the active kitchen queue with a provider charge verified more than 60 seconds ago. Collected orders, refund states and charges recorded as exceptions are excluded.
        fiscalReceiptsOverdue:
          type: integer
          format: int64
          minimum: 0
          description: Paid direct orders with a recorded handoff older than the receipt deadline and a pending fiscal receipt.
        fiscalReceiptOverdueAfterMinutes: { type: integer, minimum: 1 }
    OperatorDailyReconciliation:
      type: object
      required: [date, timeZone, currency, from, until, asOf, acceptedPayments, exceptionPayments, verifiedRefunds, attachedReceipts, unattachedReceipts, openExceptions, undatedAcceptedPayments]
      properties:
        date: { type: string, format: date }
        timeZone: { type: string, const: Africa/Kigali }
        currency: { type: string, const: RWF }
        from: { $ref: '#/components/schemas/Timestamp' }
        until: { $ref: '#/components/schemas/Timestamp' }
        asOf: { $ref: '#/components/schemas/Timestamp' }
        acceptedPayments: { $ref: '#/components/schemas/ReconciliationBucket', description: Orders accepted within the date, including orders later refunded. }
        exceptionPayments: { $ref: '#/components/schemas/ReconciliationBucket', description: Distinct late, duplicate or superseded charges recorded within the date. }
        verifiedRefunds: { $ref: '#/components/schemas/ReconciliationBucket', description: Refund verifications recorded within the date. }
        attachedReceipts: { $ref: '#/components/schemas/ReconciliationBucket', description: Fiscal PDFs attached within the date. }
        unattachedReceipts: { $ref: '#/components/schemas/ReconciliationBucket', description: Still-paid accepted orders for this date without an attached receipt at the time of the report. }
        openExceptions: { $ref: '#/components/schemas/ReconciliationBucket', description: Payment exceptions recorded within the date without a verified refund for that exact charge. }
        undatedAcceptedPayments: { $ref: '#/components/schemas/ReconciliationBucket', description: Earlier accepted orders for the store with unknown acceptance date. Excluded from dated totals. }
    OperatorPaymentReview:
      type: object
      additionalProperties: false
      required: [exceptions]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Cursor supplied by the API for the next filtered page. Omitted for legacy requests.
        exceptions:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [orderId, merchantReference, providerTransactionId, reason, createdAt]
            properties:
              orderId: { type: string, format: uuid }
              merchantReference: { type: string, format: uuid, description: Merchant payment reference sent as tx_ref. }
              providerTransactionId: { type: string }
              refund: { $ref: '#/components/schemas/VerifiedRefund' }
              reason: { type: string, enum: [duplicate_transaction, unavailable_reservation, superseded_attempt, restaurant_cancelled] }
              createdAt: { $ref: '#/components/schemas/Timestamp' }
    OperatorPendingPaymentAttempts:
      type: object
      additionalProperties: false
      required: [attempts, hasMore]
      properties:
        attempts:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [orderId, merchantReference, reservationExpiresAt, lastCheckedAt]
            properties:
              orderId: { type: string, format: uuid }
              merchantReference: { type: string, format: uuid, description: Merchant payment reference sent as tx_ref. }
              reservationExpiresAt: { $ref: '#/components/schemas/Timestamp' }
              lastCheckedAt:
                description: Most recent verification claim time. A claim does not establish the result.
                oneOf:
                  - $ref: '#/components/schemas/Timestamp'
                  - type: 'null'
        hasMore: { type: boolean, description: More eligible attempts follow this page. }
    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable URI identifying the problem type. The agreed URI registry belongs to the API.
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: Optional safe description for the user. }
        instance: { type: string, format: uri-reference, description: Optional opaque occurrence identifier. }
        code: { type: string, description: CrustCaper extension for mapping a known problem type to a client code. }
    NotFoundProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            status: { const: 404 }
            code: { const: not_found }
    Amount:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Whole RWF units, bounded to values exactly representable by the mobile client.
    Timestamp: { type: string, format: date-time }
    GuestSession:
      type: object
      required: [accessToken, expiresAt, refreshToken, refreshExpiresAt]
      properties:
        sessionId: { type: string, format: uuid, description: Stable session identifier for clients that rotate refresh credentials. }
        accessToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        refreshToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        refreshExpiresAt: { $ref: '#/components/schemas/Timestamp' }
    GuestRefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        rotationKey: { type: string, format: uuid, description: Securely generated operation key persisted before the first rotation request. }
    Localized:
      type: object
      required: [en, rw]
      properties:
        en: { type: string }
        rw: { type: string }
    Modifier:
      type: object
      required: [id, name, price]
      properties:
        id: { type: string }
        name: { $ref: '#/components/schemas/Localized' }
        price: { $ref: '#/components/schemas/Amount' }
    Product:
      type: object
      required: [sku, name, description, ingredients, allergens, category, price, available, modifiers]
      properties:
        sku: { type: string }
        name: { $ref: '#/components/schemas/Localized' }
        description: { $ref: '#/components/schemas/Localized' }
        ingredients: { type: array, items: { $ref: '#/components/schemas/Localized' } }
        allergens: { type: array, items: { $ref: '#/components/schemas/Localized' } }
        category: { type: string, enum: [burgers, combos, sides, drinks] }
        price: { $ref: '#/components/schemas/Amount' }
        available: { type: boolean }
        modifiers: { type: array, items: { $ref: '#/components/schemas/Modifier' } }
        photoUrl: { type: string, format: uri }
    Store:
      type: object
      required: [id, name, area, open, hours]
      properties:
        id: { type: string }
        name: { $ref: '#/components/schemas/Localized' }
        area: { $ref: '#/components/schemas/Localized' }
        open: { type: boolean }
        hours: { $ref: '#/components/schemas/Localized' }
        supportUrl: { type: string, format: uri }
        directionsUrl: { type: string, format: uri }
    Slot:
      type: object
      required: [id, startsAt, endsAt, available]
      properties:
        id: { type: string }
        startsAt: { $ref: '#/components/schemas/Timestamp' }
        endsAt: { $ref: '#/components/schemas/Timestamp' }
        available: { type: boolean }
    Menu:
      type: object
      required: [version, updatedAt, store, products, slots]
      properties:
        version: { type: string }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        store: { $ref: '#/components/schemas/Store' }
        products: { type: array, items: { $ref: '#/components/schemas/Product' } }
        slots: { type: array, items: { $ref: '#/components/schemas/Slot' } }
    OrderDataExport:
      type: object
      additionalProperties: false
      required: [orderId, storeId, phone, email, lines, total, tax, currency, status, paymentStatus, receiptStatus,
        createdAt, pickupStartsAt, pickupEndsAt]
      properties:
        orderId: { type: string, format: uuid }
        storeId: { type: string }
        phone: { type: string }
        email: { type: ['string', 'null'] }
        lines: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
        total: { $ref: '#/components/schemas/Amount' }
        tax: { $ref: '#/components/schemas/Amount' }
        currency: { type: string, const: RWF }
        status: { $ref: '#/components/schemas/Order/properties/status' }
        paymentStatus: { $ref: '#/components/schemas/Order/properties/paymentStatus' }
        receiptStatus: { $ref: '#/components/schemas/Order/properties/receiptStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        pickupStartsAt: { $ref: '#/components/schemas/Timestamp' }
        pickupEndsAt: { $ref: '#/components/schemas/Timestamp' }
    OrderErasureStatus:
      type: string
      enum: [pending, in_review]
    OrderErasureRequest:
      type: object
      additionalProperties: false
      required: [requestId, submittedAt, status, reviewedAt]
      properties:
        requestId: { type: string, format: uuid }
        submittedAt: { $ref: '#/components/schemas/Timestamp' }
        status: { $ref: '#/components/schemas/OrderErasureStatus' }
        reviewedAt: { type: ['string', 'null'], format: date-time }
    OrderErasureRequestResponse:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request:
          oneOf:
            - $ref: '#/components/schemas/OrderErasureRequest'
            - type: 'null'
    OperatorErasureRequest:
      type: object
      additionalProperties: false
      required: [requestId, orderId, submittedAt, status, reviewedAt]
      properties:
        requestId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        submittedAt: { $ref: '#/components/schemas/Timestamp' }
        status: { $ref: '#/components/schemas/OrderErasureStatus' }
        reviewedAt: { type: ['string', 'null'], format: date-time }
    SoldItem:
      type: object
      readOnly: true
      required: [catalogVersion, name, ingredients, allergens, modifiers]
      description: Server-derived facts from the accepted catalog edition. Present on new quotes and orders, and absent on historical orders that never stored these facts.
      properties:
        catalogVersion:
          type: string
          description: Catalog edition used for the quote. Unrelated catalog changes do not change the saved edition.
        name: { $ref: '#/components/schemas/Localized' }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/Localized' }
          description: Published ingredients of the base recipe.
        allergens:
          type: array
          items: { $ref: '#/components/schemas/Localized' }
          description: Published allergen declarations of the base recipe.
        modifiers:
          type: array
          maxItems: 25
          items: { $ref: '#/components/schemas/Modifier' }
          description: Exactly the options selected on this line, with their original names and RWF prices.
    CartLine:
      type: object
      required: [sku, modifierIds, quantity, unitPrice]
      properties:
        sku: { type: string }
        modifierIds:
          type: array
          uniqueItems: true
          items: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unitPrice:
          $ref: '#/components/schemas/Amount'
          description: Client estimate in a quote request. Recalculated by the server.
        soldItem:
          $ref: '#/components/schemas/SoldItem'
          description: Ignored as input. Order creation requires a fresh quote when any of these material facts have changed.
    QuoteRequest:
      type: object
      required: [storeId, slotId, lines]
      properties:
        storeId: { type: string }
        slotId: { type: string }
        lines: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/CartLine' } }
    QuoteChange:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [price, unavailable, slot] }
        sku: { type: string }
        previousPrice: { $ref: '#/components/schemas/Amount' }
        currentPrice: { $ref: '#/components/schemas/Amount' }
    Quote:
      type: object
      required: [quoteId, storeId, slotId, lines, subtotal, tax, total, currency, expiresAt, changes,
        pickupStartsAt, pickupEndsAt]
      properties:
        quoteId: { type: string }
        storeId: { type: string }
        slotId: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
        subtotal: { $ref: '#/components/schemas/Amount' }
        tax: { $ref: '#/components/schemas/Amount' }
        total: { $ref: '#/components/schemas/Amount' }
        currency: { type: string, const: RWF }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        changes: { type: array, items: { $ref: '#/components/schemas/QuoteChange' } }
        pickupStartsAt: { $ref: '#/components/schemas/Timestamp' }
        pickupEndsAt: { $ref: '#/components/schemas/Timestamp' }
    Reorder:
      type: object
      required: [lines, changes]
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
        changes: { type: array, items: { $ref: '#/components/schemas/QuoteChange' } }
    PaymentAttempt:
      type: object
      required: [id, status, checkoutUrl]
      properties:
        id: { type: string }
        status: { type: string, enum: [processing, paid, declined] }
        checkoutUrl:
          type: ['string', 'null']
          format: uri
          description: Hosted checkout URL for an active payment hold. Returns null when the hold or order has closed.
    Order:
      type: object
      required: [id, storeId, slotId, lines, total, tax, currency, paymentStatus, status, pickupCode,
        receiptStatus, receiptUrl, paymentAttempt, createdAt, reservationExpiresAt, pickupStartsAt, pickupEndsAt]
      properties:
        id: { type: string }
        storeId: { type: string }
        slotId: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
        total: { $ref: '#/components/schemas/Amount' }
        tax: { $ref: '#/components/schemas/Amount' }
        currency: { type: string, const: RWF }
        status: { type: string, enum: [awaiting_payment, accepted, preparing, ready, collected, cancelled] }
        paymentStatus: { type: string, enum: [unpaid, processing, paid, declined, refund_pending, refunded] }
        pickupCode: { type: ['string', 'null'] }
        receiptStatus: { type: string, enum: [pending, issued, corrected] }
        receiptUrl: { type: ['string', 'null'], format: uri-reference }
        recoveryReadOnly:
          type: boolean
          const: true
          description: Present when the current guest can read an order with an open or processing checkout and has no checkout authority for it.
        paymentAttempt:
          anyOf:
            - $ref: '#/components/schemas/PaymentAttempt'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        reservationExpiresAt: { $ref: '#/components/schemas/Timestamp' }
        pickupStartsAt: { $ref: '#/components/schemas/Timestamp' }
        pickupEndsAt: { $ref: '#/components/schemas/Timestamp' }
